<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h2>ROCK</h2>
        <h2>PAPER</h2>
        <h2>SCISSOR</h2>
    </div>
    <div class="main-container">
        <div class="rock-paper-scissor">
            <button class="img" id="rock"></button>
            <button class="img" id="paper"></button>
            <button class="img" id="scissor"></button>
        </div>
        <div class="point-counts">
            <div id="user-score">
                <p id="user-count">0</p>
                <div id="user" class="points">YOU</div>
            </div>
            <div id="comp-score">
                <p id="comp-count">0</p>
                <div id="comp" class="points">COMP</div>
            </div>
        </div>
        <div class="win-loss-message">Select Your Choice</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
